name: Deploy Backend - SaaS Postgres Copy

on:
  push:
    branches:
      - codex/current-saas-postgres-20260705
  workflow_dispatch:

concurrency:
  group: formation3-saas-postgres-copy
  cancel-in-progress: true

jobs:
  postgres-integration:
    uses: ./.github/workflows/postgres-ci.yml

  build:
    needs: postgres-integration
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Package backend
        run: |
          cd backend
          zip -r ../python-app.zip . -x "antenv/*" "__pycache__/*" "*.pyc"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: python-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    env:
      APP_NAME: Formation3
      STARTUP_COMMAND: python run.py
      COPY_FRONTEND_URL: https://polite-bush-07d4fdd03.1.azurestaticapps.net
      DATABASE_URL: ${{ secrets.SAAS_POSTGRES_DATABASE_URL || secrets.DATABASE_URL || secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SAAS_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SAAS_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SAAS_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AZURE_TTS_STORAGE_CONNECTION_STRING: ${{ secrets.SAAS_AZURE_TTS_STORAGE_CONNECTION_STRING || secrets.AZURE_TTS_STORAGE_CONNECTION_STRING }}
      INTERNAL_ADMIN_PASSWORD_HASH: ${{ secrets.SAAS_INTERNAL_ADMIN_PASSWORD_HASH || secrets.INTERNAL_ADMIN_PASSWORD_HASH }}
      SECRET_KEY: ${{ secrets.SAAS_SECRET_KEY || secrets.SECRET_KEY }}
      AUTO_LOGOUT_WEBHOOK_SECRET: ${{ secrets.SAAS_AUTO_LOGOUT_WEBHOOK_SECRET || secrets.AUTO_LOGOUT_WEBHOOK_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.SAAS_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.SAAS_DEEPSEEK_API_KEY || secrets.DEEPSEEK_API_KEY }}
      FISH_AUDIO_API_KEY: ${{ secrets.SAAS_FISH_AUDIO_API_KEY || secrets.FISH_AUDIO_API_KEY }}
      FISH_AUDIO_VOICE_ID: ${{ secrets.SAAS_FISH_AUDIO_VOICE_ID || secrets.FISH_AUDIO_VOICE_ID }}
      AZURE_AUDIO_STORAGE_CONNECTION_STRING: ${{ secrets.SAAS_AZURE_AUDIO_STORAGE_CONNECTION_STRING || secrets.AZURE_AUDIO_STORAGE_CONNECTION_STRING }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.SAAS_AZURE_STORAGE_CONNECTION_STRING || secrets.AZURE_STORAGE_CONNECTION_STRING }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure Formation3
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_27CAD6565966460DAF8B1817C6400475 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_49A11822A72A4BAA8989303BCB6DFECD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F503B1C3D33E465EBB0C2A66B05DE8B9 }}

      - name: Resolve Azure resource group
        shell: bash
        run: |
          RESOURCE_GROUP="$(az webapp list --query "[?name=='${APP_NAME}'].resourceGroup | [0]" -o tsv)"
          if [ -z "${RESOURCE_GROUP}" ] || [ "${RESOURCE_GROUP}" = "null" ]; then
            echo "Unable to resolve resource group for ${APP_NAME}" >&2
            exit 1
          fi
          echo "RESOURCE_GROUP=${RESOURCE_GROUP}" >> "${GITHUB_ENV}"

      - name: Validate required SaaS settings
        shell: bash
        run: |
          missing=()
          for key in DATABASE_URL SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY SECRET_KEY AUTO_LOGOUT_WEBHOOK_SECRET; do
            value="${!key:-}"
            existing="$(az webapp config appsettings list \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${APP_NAME}" \
              --query "[?name=='${key}'].value | [0]" \
              -o tsv)"
            if [ -z "${value}" ] && [ -z "${existing}" ]; then
              missing+=("${key}")
            elif [ -z "${value}" ]; then
              printf '%s=%s\n' "${key}" "${existing}" >> "${GITHUB_ENV}"
            fi
          done

          for key in ANTHROPIC_API_KEY FISH_AUDIO_API_KEY AZURE_AUDIO_STORAGE_CONNECTION_STRING; do
            if [ -z "${!key:-}" ]; then
              missing+=("${key}")
              printf 'PIPELINE_DEPENDENCY_MISSING target=%s key=%s\n' "${APP_NAME}" "${key}" >&2
            else
              printf 'PIPELINE_DEPENDENCY_READY target=%s key=%s\n' "${APP_NAME}" "${key}"
            fi
          done

          if [ -z "${AZURE_TTS_STORAGE_CONNECTION_STRING:-}" ]; then
            existing_tts_storage="$(az webapp config appsettings list \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${APP_NAME}" \
              --query "[?name=='AZURE_TTS_STORAGE_CONNECTION_STRING'].value | [0]" \
              -o tsv)"
            existing_general_storage="$(az webapp config appsettings list \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${APP_NAME}" \
              --query "[?name=='AZURE_STORAGE_CONNECTION_STRING'].value | [0]" \
              -o tsv)"
            if [ -z "${existing_tts_storage}" ] && [ -z "${existing_general_storage}" ]; then
              missing+=("AZURE_TTS_STORAGE_CONNECTION_STRING|AZURE_STORAGE_CONNECTION_STRING")
            elif [ -n "${existing_tts_storage}" ]; then
              printf 'AZURE_TTS_STORAGE_CONNECTION_STRING=%s\n' "${existing_tts_storage}" >> "${GITHUB_ENV}"
            fi
          fi

          if [ -z "${INTERNAL_ADMIN_PASSWORD_HASH:-}" ]; then
            existing_admin_hash="$(az webapp config appsettings list \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${APP_NAME}" \
              --query "[?name=='INTERNAL_ADMIN_PASSWORD_HASH'].value | [0]" \
              -o tsv)"
            existing_admin_secret="$(az webapp config appsettings list \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${APP_NAME}" \
              --query "[?name=='INTERNAL_ADMIN_PASSWORD'].value | [0]" \
              -o tsv)"
            if [ -z "${existing_admin_hash}" ] && [ -z "${existing_admin_secret}" ]; then
              missing+=("INTERNAL_ADMIN_PASSWORD_HASH")
            elif [ -n "${existing_admin_hash}" ]; then
              printf 'INTERNAL_ADMIN_PASSWORD_HASH=%s\n' "${existing_admin_hash}" >> "${GITHUB_ENV}"
            fi
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required SaaS app setting(s) on %s: %s\n' "${APP_NAME}" "${missing[*]}" >&2
            printf 'Add them either as Azure App Settings or GitHub Secrets prefixed with SAAS_ before deploying.\n' >&2
            exit 1
          fi

      - name: Apply idempotent Postgres schema
        shell: bash
        run: |
          python -m pip install "psycopg[binary]>=3.2.0"
          mkdir -p "${RUNNER_TEMP}/socrate-backend"
          unzip -q python-app.zip -d "${RUNNER_TEMP}/socrate-backend"
          python "${RUNNER_TEMP}/socrate-backend/tools/database/apply_postgres_schema.py" \
            --database-url "${DATABASE_URL}"

      - name: Configure SaaS Postgres copy
        shell: bash
        run: |
          az webapp config appsettings delete \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${APP_NAME}" \
            --setting-names DB_PATH SQLITE_SAFETY_STRICT \
            >/dev/null

          az webapp config appsettings set \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${APP_NAME}" \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              ENABLE_ORYX_BUILD=true \
              PORT=8000 \
              WEBSITES_PORT=8000 \
              DATABASE_BACKEND=postgres \
              PIPELINE_DATABASE_BACKEND=postgres \
              PIPELINE_POSTGRES_MIRROR=0 \
              PIPELINE_EXECUTION_MODE=queue \
              PIPELINE_QUEUE_BACKEND=database \
              PIPELINE_EMBEDDED_WORKER=1 \
              PIPELINE_WORK_MAX_ATTEMPTS=5 \
              PIPELINE_WORK_LEASE_SECONDS=300 \
              PIPELINE_WORK_HEARTBEAT_SECONDS=60 \
              PIPELINE_WORKER_POLL_SECONDS=1 \
              COURSE_SCHEDULER_ENABLED=1 \
              COURSE_SCHEDULER_INTERVAL_SECONDS=300 \
              COURSE_SCHEDULE_CHANGE_CUTOFF_HOURS=72 \
              SCHEDULED_AUDIO_HORIZON_HOURS=24 \
              SCHEDULED_AUDIO_MAX_AUTO_ATTEMPTS=4 \
              SCHEDULED_AUDIO_RETRY_BASE_MINUTES=5 \
              SCHEDULED_AUDIO_RETRY_MAX_MINUTES=60 \
              PIPELINE_ARTIFACTS_REQUIRED=1 \
              PIPELINE_BLOB_MAX_ATTEMPTS=3 \
              AZURE_PIPELINE_ARTIFACT_CONTAINER=pipeline-artifacts \
              POSTGRES_POOL_MIN_SIZE=1 \
              POSTGRES_POOL_MAX_SIZE=12 \
              POSTGRES_POOL_TIMEOUT_SECONDS=30 \
              POSTGRES_POOL_MAX_LIFETIME_SECONDS=1800 \
              POSTGRES_POOL_MAX_IDLE_SECONDS=300 \
              POSTGRES_POOL_RECONNECT_TIMEOUT_SECONDS=60 \
              POSTGRES_CONNECT_TIMEOUT_SECONDS=20 \
              POSTGRES_FORCE_IPV4=0 \
              POSTGRES_TIMEZONE=Europe/Paris \
              SUPABASE_DATABASE_REST_FALLBACK=0 \
              STUDENT_AUTH_LEGACY_FALLBACK=0 \
              HR_DASHBOARD_ENABLED=true \
              HR_DASHBOARD_REPAIR_ON_LOAD=false \
              FORMATION_CONTENT_DAY_WORKERS=3 \
              FORMATION_CONTENT_DAY_WORKERS_MAX=8 \
              FORMATION_STRUCTURED_COURSE_WORKERS=7 \
              FORMATION_TTS_WORDS_PER_MINUTE=165.7 \
              BASIC_TTS_SPEED=1.15 \
              PLATFORM_1_FRONTEND_URL="${COPY_FRONTEND_URL}" \
              PLATFORM_2_FRONTEND_URL="${COPY_FRONTEND_URL}" \
              PLATFORM_3_FRONTEND_URL="${COPY_FRONTEND_URL}" \
              PLATFORM_4_FRONTEND_URL="${COPY_FRONTEND_URL}" \
              PLATFORM_5_FRONTEND_URL="${COPY_FRONTEND_URL}" \
              PLATFORM_6_FRONTEND_URL="${COPY_FRONTEND_URL}" \
              PLATFORM_7_FRONTEND_URL="${COPY_FRONTEND_URL}" \
              PLATFORM_8_FRONTEND_URL="${COPY_FRONTEND_URL}" \
              PLATFORM_9_FRONTEND_URL="${COPY_FRONTEND_URL}" \
            >/dev/null

          secret_settings=()
          [ -n "${DATABASE_URL:-}" ] && secret_settings+=("DATABASE_URL=${DATABASE_URL}")
          [ -n "${SUPABASE_URL:-}" ] && secret_settings+=("SUPABASE_URL=${SUPABASE_URL}")
          [ -n "${SUPABASE_ANON_KEY:-}" ] && secret_settings+=("SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}")
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && secret_settings+=("SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}")
          [ -n "${AZURE_TTS_STORAGE_CONNECTION_STRING:-}" ] && secret_settings+=("AZURE_TTS_STORAGE_CONNECTION_STRING=${AZURE_TTS_STORAGE_CONNECTION_STRING}")
          [ -n "${INTERNAL_ADMIN_PASSWORD_HASH:-}" ] && secret_settings+=("INTERNAL_ADMIN_PASSWORD_HASH=${INTERNAL_ADMIN_PASSWORD_HASH}")
          [ -n "${SECRET_KEY:-}" ] && secret_settings+=("SECRET_KEY=${SECRET_KEY}")
          [ -n "${AUTO_LOGOUT_WEBHOOK_SECRET:-}" ] && secret_settings+=("AUTO_LOGOUT_WEBHOOK_SECRET=${AUTO_LOGOUT_WEBHOOK_SECRET}")
          [ -n "${ANTHROPIC_API_KEY:-}" ] && secret_settings+=("ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}")
          [ -n "${DEEPSEEK_API_KEY:-}" ] && secret_settings+=("DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}")
          [ -n "${FISH_AUDIO_API_KEY:-}" ] && secret_settings+=("FISH_AUDIO_API_KEY=${FISH_AUDIO_API_KEY}")
          [ -n "${FISH_AUDIO_VOICE_ID:-}" ] && secret_settings+=("FISH_AUDIO_VOICE_ID=${FISH_AUDIO_VOICE_ID}")
          [ -n "${AZURE_AUDIO_STORAGE_CONNECTION_STRING:-}" ] && secret_settings+=("AZURE_AUDIO_STORAGE_CONNECTION_STRING=${AZURE_AUDIO_STORAGE_CONNECTION_STRING}")
          [ -n "${AZURE_STORAGE_CONNECTION_STRING:-}" ] && secret_settings+=("AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}")

          if [ "${#secret_settings[@]}" -gt 0 ]; then
            az webapp config appsettings set \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${APP_NAME}" \
              --settings "${secret_settings[@]}" \
              >/dev/null
          fi

          az webapp config set \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${APP_NAME}" \
            --startup-file "${STARTUP_COMMAND}" \
            --generic-configurations '{"healthCheckPath":"/readyz"}' \
            >/dev/null

          configured_backend="$(az webapp config appsettings list \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${APP_NAME}" \
            --query "[?name=='DATABASE_BACKEND'].value | [0]" \
            -o tsv)"
          stale_sqlite_settings="$(az webapp config appsettings list \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${APP_NAME}" \
            --query "[?name=='DB_PATH' || name=='SQLITE_SAFETY_STRICT'].name" \
            -o tsv)"
          if [ "${configured_backend}" != "postgres" ] || [ -n "${stale_sqlite_settings}" ]; then
            printf 'PURE_POSTGRES_CONFIGURATION_FAILED backend=%s stale_sqlite_settings=%s\n' \
              "${configured_backend:-missing}" "${stale_sqlite_settings:-none}" >&2
            exit 1
          fi
          printf 'PURE_POSTGRES_CONFIGURATION_OK backend=postgres sqlite_settings=absent\n'

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Formation3'
          package: python-app.zip
