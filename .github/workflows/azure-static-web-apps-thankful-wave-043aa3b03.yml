name: Deploy Frontend - Socrate1

on:
  push:
    branches:
      - staging
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Environnement à déployer"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  deploy_production_or_pr_preview:
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Deploy Production or PR Preview
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Build and deploy production / PR preview
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_WAVE_043AA3B03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./frontend"
          api_location: ""
          output_location: "dist"
          production_branch: ${{ github.event_name == 'workflow_dispatch' && 'staging' || 'main' }}
        env:
          NODE_VERSION: 20.19.6
          VITE_API_URL: https://socrate1-fyhgbqh7ejeyb2f3.francecentral-01.azurewebsites.net

  deploy_staging_named_environment:
    if: >
      (github.event_name == 'push' && github.ref_name == 'staging') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    name: Deploy Staging Named Environment
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Build and deploy staging
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_WAVE_043AA3B03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./frontend"
          api_location: ""
          output_location: "dist"
          deployment_environment: "staging"
        env:
          NODE_VERSION: 20.19.6
          VITE_API_URL: ${{ vars.SOCRATE1_STAGING_API_URL || 'https://socrate1-staging.azurewebsites.net' }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_WAVE_043AA3B03 }}
          action: "close"
