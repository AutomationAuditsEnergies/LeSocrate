name: Deploy Backend - socrate1

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Package backend
        run: |
          cd backend
          zip -r ../python-app.zip . -x "antenv/*" "__pycache__/*" "*.pyc"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: python-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    env:
      RESOURCE_GROUP: socrate1_group
      STARTUP_COMMAND: gunicorn --worker-class gunicorn.workers.geventlet.EventletWorker -w 1 --bind 0.0.0.0:8000 --timeout 120 run:app

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4A8A266416524733B4971777A0995D2C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_41081722FD194A6DBBEE83B7861AA33F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DD044DCD13764A6CBF8D1889CF9E5B07 }}

      - name: Configure Azure App Service production
        shell: bash
        run: |
          az webapp config appsettings set \
            --resource-group "${RESOURCE_GROUP}" \
            --name socrate1 \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              ENABLE_ORYX_BUILD=true \
              FORMATION_TTS_WORDS_PER_MINUTE=165.7 \
              BASIC_TTS_SPEED=1.15 \
              PLATFORM_1_FRONTEND_URL=https://thankful-wave-043aa3b03.4.azurestaticapps.net

          az webapp config set \
            --resource-group "${RESOURCE_GROUP}" \
            --name socrate1 \
            --startup-file "${STARTUP_COMMAND}"

      - name: Deploy to Azure Web App production
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'socrate1'
          package: python-app.zip
