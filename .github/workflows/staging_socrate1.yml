name: Deploy Backend - socrate1

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      target:
        description: "Environnement à déployer"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            ./backend
            !./backend/antenv/

  deploy:
    if: >
      (github.event_name == 'push' && github.ref_name == 'staging') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    env:
      DEPLOY_SLOT: ${{ ((github.event_name == 'push' && github.ref_name == 'staging') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')) && 'staging' || 'Production' }}
      RESOURCE_GROUP: socrate1_group
      STARTUP_COMMAND: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:8000 --timeout 120 run:app

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4A8A266416524733B4971777A0995D2C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_41081722FD194A6DBBEE83B7861AA33F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DD044DCD13764A6CBF8D1889CF9E5B07 }}

      - name: Configure Azure App Service slot
        shell: bash
        run: |
          if [ "${DEPLOY_SLOT}" = "staging" ]; then
            az webapp config appsettings set \
              --resource-group "${RESOURCE_GROUP}" \
              --name socrate1 \
              --slot staging \
              --settings \
                SCM_DO_BUILD_DURING_DEPLOYMENT=true \
                ENABLE_ORYX_BUILD=true \
                DB_PATH=/home/database-staging.db \
                PLATFORM_1_FRONTEND_URL=https://thankful-wave-043aa3b03-staging.4.azurestaticapps.net

            az webapp config set \
              --resource-group "${RESOURCE_GROUP}" \
              --name socrate1 \
              --slot staging \
              --startup-file "${STARTUP_COMMAND}"
          else
            az webapp config appsettings set \
              --resource-group "${RESOURCE_GROUP}" \
              --name socrate1 \
              --settings \
                SCM_DO_BUILD_DURING_DEPLOYMENT=true \
                ENABLE_ORYX_BUILD=true \
                PLATFORM_1_FRONTEND_URL=https://thankful-wave-043aa3b03.4.azurestaticapps.net

            az webapp config set \
              --resource-group "${RESOURCE_GROUP}" \
              --name socrate1 \
              --startup-file "${STARTUP_COMMAND}"
          fi

      - name: Deploy to Azure Web App staging slot
        if: env.DEPLOY_SLOT == 'staging'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'socrate1'
          slot-name: staging
          package: .

      - name: Deploy to Azure Web App production
        if: env.DEPLOY_SLOT != 'staging'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'socrate1'
          package: .
