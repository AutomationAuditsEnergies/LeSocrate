<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le Socrate</title>
    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Plus Jakarta Sans + Space Grotesk (Landing page) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Material Icons Round + Symbols Rounded (Landing page) -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <!-- Material Icons loaded locally via CSS for Windows compatibility -->
    <!-- Fond de la page de login : téléchargé dès le HTML, avant même le JS -->
    <link rel="preload" as="image" href="/static/images/rocket.jpg" fetchpriority="high">
    <!-- Wallpaper hero de la landing : préchargé pour un affichage instantané -->
    <link rel="preload" as="image" href="/fond-hero2.webp" fetchpriority="high">
    <style>
      /* Splash affiché pendant le téléchargement du bundle JS — remplacé dès
         que React monte (#root:empty ne matche plus). Évite l'écran noir. */
      #root:empty {
        position: fixed;
        inset: 0;
        background-color: #1e1b4b;
        background-image: url("/static/images/rocket.jpg"), linear-gradient(160deg, #0f172a 0%, #1e1b4b 55%, #312e81 100%);
        background-size: cover;
        background-position: center;
      }
      #root:empty::before {
        content: "";
        position: absolute;
        top: calc(50% - 26px);
        left: calc(50% - 26px);
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 3px solid rgba(139, 92, 246, 0.25);
        border-top-color: #8B5CF6;
        animation: socrate-spin 0.8s linear infinite;
      }
      #root:empty::after {
        content: "LE SOCRATE";
        position: absolute;
        top: calc(50% + 44px);
        left: 0;
        right: 0;
        text-align: center;
        font-family: "Poppins", system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.35em;
        color: rgba(226, 232, 240, 0.85);
      }
      @keyframes socrate-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
