<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cadrenza-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c2026" />
    <meta
      name="description"
      content="Cadrenza transforme un référentiel RNCP en parcours synchrone, réutilisable et pilotable promotion après promotion."
    />
    <meta property="og:title" content="Cadrenza — Parcours RNCP synchrones" />
    <meta
      property="og:description"
      content="Produisez un parcours une fois, puis orchestrez chaque promotion au bon rythme."
    />
    <meta property="og:type" content="website" />
    <title>Cadrenza — Parcours RNCP synchrones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
    <!-- Material Icons Round + Symbols Rounded : self-hostés via index.css
         (plus de dépendance Google Fonts → icônes fiables sur la landing) -->
    <link rel="preload" as="image" href="/cadrenza-robot-fleet.webp" type="image/webp" fetchpriority="high">
    <style>
      /* État de chargement avant le montage de React. */
      #root:empty {
        position: fixed;
        inset: 0;
        background: #f7f8fb;
      }
      #root:empty::before {
        content: "";
        position: absolute;
        top: calc(50% - 32px);
        left: calc(50% - 28px);
        width: 56px;
        height: 56px;
        background: url("/cadrenza-mark.svg") center / contain no-repeat;
        animation: cadrenza-pulse 1.2s ease-in-out infinite;
      }
      #root:empty::after {
        content: "CADRENZA";
        position: absolute;
        top: calc(50% + 40px);
        left: 0;
        right: 0;
        text-align: center;
        font-family: "Archivo", "Inter", system-ui, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.28em;
        color: #0b1424;
      }
      @keyframes cadrenza-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes cadrenza-pulse {
        0%, 100% { opacity: 0.72; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1); }
      }

      /* La landing amorce directement son univers graphite. */
      html.landing-boot #root:empty {
        background-color: #1c2026;
        background-image:
          linear-gradient(90deg, rgba(28, 32, 38, 0.98) 0%, rgba(28, 32, 38, 0.88) 45%, rgba(28, 32, 38, 0.5) 100%),
          url("/cadrenza-robot-fleet.webp");
        background-size: cover;
        background-position: center;
      }
      html.landing-boot #root:empty::after {
        color: #f4f8fc;
      }
    </style>
    <script>
      // Détecte la landing avant le rendu pour adapter le splash.
      if (window.location.pathname === '/' || window.location.pathname === '/landing') {
        document.documentElement.classList.add('landing-boot');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
