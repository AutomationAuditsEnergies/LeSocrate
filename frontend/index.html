<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le Socrate</title>
    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Plus Jakarta Sans + Space Grotesk (Landing page) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Material Icons Round + Symbols Rounded : self-hostés via index.css
         (plus de dépendance Google Fonts → icônes fiables sur la landing) -->
    <!-- Fond de la page de login : téléchargé dès le HTML, avant même le JS -->
    <link rel="preload" as="image" href="/static/images/rocket.jpg" fetchpriority="high">
    <!-- Wallpaper hero de la landing : préchargé pour un affichage instantané -->
    <link rel="preload" as="image" href="/fond-hero2.webp" fetchpriority="high">
    <style>
      /* Splash affiché pendant le téléchargement du bundle JS — remplacé dès
         que React monte (#root:empty ne matche plus). Évite l'écran noir. */
      #root:empty {
        position: fixed;
        inset: 0;
        background-color: #1e1b4b;
        background-image: url("/static/images/rocket.jpg"), linear-gradient(160deg, #0f172a 0%, #1e1b4b 55%, #312e81 100%);
        background-size: cover;
        background-position: center;
      }
      #root:empty::before {
        content: "";
        position: absolute;
        top: calc(50% - 26px);
        left: calc(50% - 26px);
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 3px solid rgba(139, 92, 246, 0.25);
        border-top-color: #8B5CF6;
        animation: socrate-spin 0.8s linear infinite;
      }
      #root:empty::after {
        content: "LE SOCRATE";
        position: absolute;
        top: calc(50% + 44px);
        left: 0;
        right: 0;
        text-align: center;
        font-family: "Poppins", system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.35em;
        color: rgba(226, 232, 240, 0.85);
      }
      @keyframes socrate-spin {
        to { transform: rotate(360deg); }
      }

      /* Sur la landing : pas de splash "plateformes de cours" ni de spinner.
         On affiche directement le wallpaper de la landing (préchargé) pour une
         transition invisible vers la page. Classe posée par le script ci-dessous. */
      html.landing-boot #root:empty {
        background-color: #03093d;
        background-image: url("/fond-hero2.webp");
        background-size: cover;
        background-position: center 15%;
      }
      html.landing-boot #root:empty::before,
      html.landing-boot #root:empty::after {
        content: none;
        display: none;
      }
    </style>
    <script>
      // Détecte la route AVANT le rendu pour adapter le splash (cf. CSS ci-dessus).
      if (window.location.pathname === '/landing') {
        document.documentElement.classList.add('landing-boot');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
