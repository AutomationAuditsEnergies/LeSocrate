<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">TP CRCD</title>
  <desc id="desc">Vignette vert sombre avec le texte TP CRCD en blanc.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#063b2b"/>
      <stop offset="0.45" stop-color="#052e23"/>
      <stop offset="1" stop-color="#071512"/>
    </linearGradient>
    <radialGradient id="glow" cx="32%" cy="38%" r="58%">
      <stop offset="0" stop-color="#0f6a4c" stop-opacity="0.62"/>
      <stop offset="0.45" stop-color="#0b4a38" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#04110e" stop-opacity="0"/>
    </radialGradient>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.075"/>
      </feComponentTransfer>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="3" flood-color="#000000" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="3" stdDeviation="1" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#glow)"/>
  <rect width="1600" height="720" filter="url(#paper)" opacity="0.55"/>
  <text
    x="800"
    y="425"
    text-anchor="middle"
    font-family="Impact, Haettenschweiler, 'Arial Black', system-ui, sans-serif"
    font-size="196"
    font-weight="900"
    letter-spacing="8"
    fill="#f8f8f4"
    filter="url(#shadow)"
  >TP CRCD</text>
</svg>
