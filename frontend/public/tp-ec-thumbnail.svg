<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">TP EC</title>
  <desc id="desc">Vignette bleu sombre avec le texte TP EC en blanc.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062b63"/>
      <stop offset="0.42" stop-color="#042158"/>
      <stop offset="1" stop-color="#041331"/>
    </linearGradient>
    <radialGradient id="glow" cx="48%" cy="45%" r="62%">
      <stop offset="0" stop-color="#0d4f9f" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#08316e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#03112a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="3" stdDeviation="1" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#glow)"/>
  <rect width="1600" height="720" filter="url(#grain)" opacity="0.55"/>
  <text
    x="800"
    y="427"
    text-anchor="middle"
    font-family="Impact, Haettenschweiler, 'Arial Black', system-ui, sans-serif"
    font-size="206"
    font-weight="900"
    letter-spacing="9"
    fill="#fbfbf8"
    filter="url(#shadow)"
  >TP EC</text>
</svg>
